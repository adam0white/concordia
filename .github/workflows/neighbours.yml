name: Neighbours
on:
  push:
    branches: [neighbours]
    paths: ['neighbours/**', 'concordia/contrib/neighbours/**', '.github/workflows/neighbours.yml']
  pull_request:
    paths: ['neighbours/**', 'concordia/contrib/neighbours/**', '.github/workflows/neighbours.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neighbours-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GM replay checks pinned upstream component Git objects.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.0'
          cache: npm
          cache-dependency-path: neighbours/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.13'
      - run: npm ci
        working-directory: neighbours
      - run: python -m pip install -r neighbours/native-gm-requirements.txt
      - run: npm run check
        working-directory: neighbours
      - name: Install isolated Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium
        working-directory: neighbours
      - name: Real browser WASM save and recovery regressions
        run: npm run test:e2e
        working-directory: neighbours
      - name: Retain browser failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: neighbours-browser-failure
          path: |
            neighbours/playwright-report/
            neighbours/test-results/
          retention-days: 7
      - name: Thirty-day population and restored-continuation stress check
        run: node scripts/profile-town.ts --days 30 --population 208 --seed 42 --max-deaths 0
        working-directory: neighbours
      - name: Actual native HF bridge and upstream ActionSpec controls
        run: python -m unittest concordia.environment.engine_test concordia.contrib.neighbours.engine_test concordia.contrib.neighbours.bridge_test concordia.contrib.neighbours.gm_director_test concordia.contrib.neighbours.bench_director_test
        env:
          PYTHONPATH: .
          NEIGHBOURS_NATIVE_TEST: '1'
      - name: Real social episode milestones and restored continuation
        run: node scripts/profile-evenings.ts --seeds 42 --population 208 --days 25 --output "$RUNNER_TEMP/evenings.json" --checkpoint-directory "$RUNNER_TEMP/neighbours-milestones"
        working-directory: neighbours
      - name: Actual WASM and native parity and restored continuation
        run: |
          node scripts/capture-weekly.ts --output-directory "$RUNNER_TEMP/neighbours-weekly"
          npm run test:parity -- --checkpoint-directory "$RUNNER_TEMP/neighbours-weekly" --checkpoint-directory "$RUNNER_TEMP/neighbours-milestones"
        working-directory: neighbours
        env:
          PYTHON: python
      - name: Recorded mixed-town replay (zero model calls)
        run: python neighbours/scripts/run-mixed-town.py --node node --replay neighbours/public/experiments/native-mixed-town.json
      - name: Recorded upstream game-master replay (zero model calls)
        run: python neighbours/scripts/run-gm-director.py --replay neighbours/public/experiments/gm-director.json
      - name: Natural bench choice and physical continuation controls
        run: node scripts/probe-bench-choice.ts --output "$RUNNER_TEMP/bench-choices.json" --summary-output "$RUNNER_TEMP/bench-choices-summary.json" --checkpoint-directory "$RUNNER_TEMP/bench-choices"
        working-directory: neighbours
      - name: Published HF received-route controls
        run: node scripts/probe-received-routes.ts "$RUNNER_TEMP/received-routes.json"
        working-directory: neighbours
      - name: Recorded upstream bench-premise replay (zero model calls)
        run: python neighbours/scripts/run-bench-director.py --replay neighbours/public/experiments/bench-director.json
      - name: Isolated HF configuration controls
        run: node scripts/probe-hf-config.ts --output "$RUNNER_TEMP/hf-config.json"
        working-directory: neighbours
      - name: Recorded episode and project source provenance
        run: node scripts/check-evidence.mjs
        working-directory: neighbours
      - name: Cloudflare build without deployment
        run: npm run build:cloudflare
        working-directory: neighbours
      - run: npm audit --audit-level=high
        working-directory: neighbours
