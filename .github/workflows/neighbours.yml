name: Neighbours
on:
  push:
    branches: [neighbours]
    paths: ['neighbours/**', 'concordia/contrib/neighbours/**', '.github/workflows/neighbours.yml']
  pull_request:
    paths: ['neighbours/**', 'concordia/contrib/neighbours/**', '.github/workflows/neighbours.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neighbours-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GM replay checks pinned upstream component Git objects.
      - run: npm install --global pnpm@12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.0'
          cache: pnpm
          cache-dependency-path: neighbours/pnpm-lock.yaml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.13'
      - run: pnpm install --frozen-lockfile
        working-directory: neighbours
      - run: python -m pip install -r neighbours/native-gm-requirements.txt
      - run: npm run check
        working-directory: neighbours
      - name: Complete public six-person day and file replay
        run: node scripts/check-public-day.ts "$RUNNER_TEMP/neighbours-public-day"
        working-directory: neighbours
      - name: Actual native HF bridge and upstream ActionSpec controls
        run: python -m unittest concordia.environment.engine_test concordia.contrib.neighbours.engine_test concordia.contrib.neighbours.bridge_test concordia.contrib.neighbours.gm_director_test concordia.contrib.neighbours.bench_director_test
        env:
          PYTHONPATH: .
          NEIGHBOURS_NATIVE_TEST: '1'
      # HF3 numeric/model research is preserved byte-for-byte. Its mutator
      # generators and source-equality gates are historical, not runnable HF4
      # evidence. See docs/neighbours/hf4-port.md for the per-stage mapping.
      - name: Actual current WASM and native parity and restored continuation
        run: node scripts/check-parity-public.mjs
        working-directory: neighbours
        env:
          PYTHON: python
          NEIGHBOURS_PARITY_PROOF_DIR: ${{ runner.temp }}/neighbours-public-six-parity
      - name: Historical research byte custody without regeneration or current4 relabelling
        run: node scripts/check-evidence.mjs
        working-directory: neighbours
      - name: Retain complete current native inputs and outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: neighbours-public-six-native
          path: |
            ${{ runner.temp }}/neighbours-public-day/
            ${{ runner.temp }}/neighbours-public-six-parity/
          retention-days: 7
      - name: Cloudflare build without deployment
        run: npm run build:cloudflare
        working-directory: neighbours
      - run: pnpm audit --audit-level=high
        working-directory: neighbours

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEIGHBOURS_NO_SCREENSHOTS: '1'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: npm install --global pnpm@12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.0'
          cache: pnpm
          cache-dependency-path: neighbours/pnpm-lock.yaml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.13'
      - run: pnpm install --frozen-lockfile
        working-directory: neighbours
      - name: Install isolated Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium
        working-directory: neighbours
      - name: Real browser WASM save and recovery regressions
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
        working-directory: neighbours
      - name: Retain browser failure traces and DOM snapshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: neighbours-browser-failure-${{ matrix.shard }}
          path: |
            neighbours/playwright-report/
            neighbours/test-results/
          retention-days: 7

  verify:
    if: always()
    needs: [quality, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require current public-game verification and all browser shards
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$QUALITY_RESULT" = success && test "$BROWSER_RESULT" = success
